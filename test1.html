
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin: 0;
            background-color: #f4f4f4;
            color: #222222;
        }

        header {
            background-color: #17365d;
            color: #ffffff;
            padding: 20px;
        }

        nav {
            background-color: #28527a;
            padding: 10px;
        }

        main {
            background-color: #ffffff;
            font-size: 18px;
            padding: 20px;
            margin: 20px;
        }

        footer {
            background-color: #17365d;
            color: #ffffff;
            padding: 15px;
            text-align: center;
        }

        li {
            display: inline-block;
            width: 100px;
            padding: 10px;
        }

        h1 {
            text-align: center;
            font-family: Georgia, serif;
            color: #ffffff;
        }

        p {
            line-height: 1.6;
        }

        a {
            color: #ffffff;
            text-decoration: none;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main id="home">
        <h2 id="about">About Me</h2>
        <p>
            Hello! Welcome to my website. I am learning HTML
            and CSS to create beautiful and accessible web pages.
        </p>

        <h2>My Hobbies</h2>
        <p>
            I enjoy reading books, listening to music,
            and learning new things about technology.
        </p>
    </main>

    <footer id="contact">
        <p>Copyright 2026 - My Website</p>
    </footer>

</body>
</html>
