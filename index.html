<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập HTML Đầu Tiên</title>
</head>
<body>

    <!-- Thẻ ngữ nghĩa 1: <header> -->
    <header>
        <!-- Yêu cầu 1a: Sử dụng thẻ h1 -->
        <h1>Trang Web Cá Nhân Của Tôi</h1>
    </header>

    <!-- Yêu cầu 1a: Sử dụng thẻ ngữ nghĩa main -->
    <main>
        
        <!-- Thẻ ngữ nghĩa 3: <section> -->
        <section>
            <h2>Danh sách sở thích</h2>
            <!-- Yêu cầu 1b: Danh sách ít nhất 3 mục -->
            <ul>
                <li>Học lập trình web cơ bản.</li>
                <li>Đọc sách và tin tức công nghệ.</li>
                <li>Xem phim khoa học viễn tưởng.</li>
            </ul>
        </section>

        <section>
            <h2>Bộ sưu tập ảnh mẫu</h2>
            <!-- Yêu cầu 1c: Ít nhất 3 hình ảnh -->
            <p>
                <img src="https://picsum.photos" alt="Ảnh phong cảnh mẫu 1">
                <img src="https://picsum.photos" alt="Ảnh phong cảnh mẫu 2">
                <img src="https://picsum.photos" alt="Ảnh phong cảnh mẫu 3">
            </p>
        </section>

        <section>
            <h2>Tài liệu tham khảo</h2>
            <!-- Yêu cầu 1d: Ít nhất 1 liên kết bên ngoài -->
            <p>Học thêm về HTML tại trang web <a href="https://w3schools.com" target="_blank">W3Schools</a>.</p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Bài tập thực hành HTML</p>
    </footer>

</body>
</html>
